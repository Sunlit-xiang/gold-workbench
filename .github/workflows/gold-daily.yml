name: Gold daily research and Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1-5'
  workflow_dispatch:
    inputs:
      collect:
        description: Collect fresh data and freeze today (false only rebuilds the UI)
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gold-production
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      ORACLE_STATE_KEY: ${{ secrets.ORACLE_STATE_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      ORACLE_AI_PROVIDER: ${{ vars.ORACLE_AI_PROVIDER || 'off' }}
      ORACLE_AI_MODEL: ${{ vars.ORACLE_AI_MODEL }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-delivery.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research runtime
        run: pip install -r requirements-delivery.txt
      - name: Verify model and delivery contracts
        run: |
          python -m unittest discover -s tests
          node --test web/test/*.test.mjs
      - name: Restore latest authenticated archive
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ORACLE_STATE_KEY"
          mkdir -p .delivery
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/gold-state" --jq '[.assets[] | select(.name | endswith(".encrypted"))] | sort_by(.created_at) | last | .name')
          test "$asset" != null
          gh release download gold-state --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir .delivery
          python scripts/gold_state.py unpack --db research_data/oracle.sqlite --archive ".delivery/$asset"
      - name: Run daily research or rebuild approved archive
        id: pipeline
        shell: bash
        env:
          COLLECT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect) }}
        run: |
          if [ "$COLLECT" = true ]; then
            python scripts/gold_cloud.py --collect
          else
            python scripts/gold_cloud.py
          fi
      - name: Preserve encrypted append-only state even if collection fails
        if: always() && steps.restore.outcome == 'success'
        run: |
          python scripts/gold_state.py pack --db research_data/oracle.sqlite --archive .delivery/state-${{ github.run_id }}-${{ github.run_attempt }}.encrypted
          gh release upload gold-state .delivery/state-${{ github.run_id }}-${{ github.run_attempt }}.encrypted --repo "$GITHUB_REPOSITORY"
      - name: Preserve immutable public prediction records
        if: success()
        shell: bash
        run: |
          mkdir -p .delivery/ledger
          git fetch origin ledger || true
          if git show-ref --verify --quiet refs/remotes/origin/ledger; then
            git worktree add .delivery/ledger origin/ledger
          else
            git worktree add --detach .delivery/ledger
            cd .delivery/ledger
            git switch --orphan ledger
            cd ../..
          fi
          python scripts/publish_ledger.py --source dist/data/predictions --destination .delivery/ledger/records
          cd .delivery/ledger
          git config user.name 'Digital Oracle'
          git config user.email 'actions@users.noreply.github.com'
          git add records
          if ! git diff --cached --quiet; then
            git commit -m 'Append frozen Gold predictions and outcomes'
            git push origin HEAD:ledger
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Gold workbench
        id: deployment
        uses: actions/deploy-pages@v4
